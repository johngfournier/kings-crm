<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kings CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0E1117;color:#E2E8F0;height:100vh;display:flex;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#161B27}::-webkit-scrollbar-thumb{background:#2A3350;border-radius:3px}
input,select,textarea,button{font-family:inherit}
a{color:#3B82F6}
/* Layout */
#sidebar{width:220px;flex-shrink:0;background:#161B27;border-right:1px solid #2A3350;padding:20px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
#main{flex:1;overflow-y:auto;padding:28px}
/* Nav */
.nav-logo{margin-bottom:24px;padding-left:4px}
.nav-logo-title{font-size:13px;font-weight:800;color:#C8A84B;letter-spacing:1.5px;text-transform:uppercase}
.nav-logo-sub{font-size:11px;color:#64748B}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:none;cursor:pointer;padding:9px 16px;border-radius:7px;color:#64748B;font-weight:500;font-size:14px;text-align:left;border-left:3px solid transparent;transition:all .15s}
.nav-item.active{color:#E2E8F0;font-weight:700;background:rgba(200,168,75,0.09);border-left-color:#C8A84B}
.nav-item:hover:not(.active){color:#94A3B8;background:rgba(255,255,255,0.03)}
/* Sync */
.sync-section{padding:12px 4px;margin-top:auto}
.sync-label{font-size:10px;color:#64748B;margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.sync-save{background:#C8A84B;color:#0E1117;border:none;border-radius:6px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer;width:100%;margin-bottom:6px}
.sync-load{background:transparent;color:#94A3B8;border:1px solid #2A3350;border-radius:6px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer;width:100%}
.sync-save:disabled,.sync-load:disabled{opacity:.5;cursor:not-allowed}
.sync-msg{font-size:10px;margin-top:6px;line-height:1.4}
.sync-footer{font-size:10px;color:#64748B;margin-top:8px;line-height:1.5}
/* Top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.topbar h1{font-size:20px;font-weight:800;color:#E2E8F0}
.topbar-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Buttons */
.btn{border:none;border-radius:6px;cursor:pointer;font-weight:600;font-family:inherit;transition:opacity .15s;font-size:14px;padding:8px 18px;background:#C8A84B;color:#0E1117}
.btn:hover{opacity:.85}
.btn-ghost{background:transparent;color:#94A3B8;border:1px solid #2A3350;font-size:14px;padding:8px 16px}
.btn-sm{font-size:12px;padding:5px 12px}
.btn-sm-ghost{font-size:12px;padding:5px 10px;background:transparent;color:#94A3B8;border:1px solid #2A3350}
.btn-danger{background:transparent;color:#EF4444;border:1px solid rgba(239,68,68,.27);font-size:12px;padding:5px 10px}
/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:#94A3B8;margin-bottom:4px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.field label .req{color:#EF4444}
.field input,.field select,.field textarea{width:100%;background:#161B27;border:1px solid #2A3350;border-radius:6px;padding:8px 12px;color:#E2E8F0;font-size:14px;outline:none;font-family:inherit}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#C8A84B}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
/* Search bar */
.search-input{background:#1C2333;border:1px solid #2A3350;border-radius:7px;padding:7px 12px;color:#E2E8F0;font-size:13px;outline:none;width:200px}
.search-input:focus{border-color:#C8A84B}
.stage-select{background:#1C2333;border:1px solid #2A3350;border-radius:7px;padding:7px 10px;color:#E2E8F0;font-size:13px;outline:none}
/* Cards */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.contact-card{background:#1C2333;border:1px solid #2A3350;border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s}
.contact-card:hover{border-color:#C8A84B}
.contact-card-header{display:flex;gap:12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:#C8A84B;display:flex;align-items:center;justify-content:center;color:#0E1117;font-weight:800;font-size:15px;flex-shrink:0}
.contact-name{font-weight:700;font-size:15px;color:#E2E8F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-sub{font-size:12px;color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-email{font-size:12px;color:#3B82F6;margin-top:8px;display:block}
.contact-owner{font-size:11px;color:#94A3B8;margin-top:4px}
.contact-stats{display:flex;gap:8px;margin-top:8px}
.contact-stats span{font-size:11px;color:#64748B}
/* Tag */
.tag{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600;letter-spacing:.3px}
/* Pipeline */
.pipeline{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;min-width:0}
.pipeline-col{flex:0 0 180px;background:#1C2333;border:1px solid #2A3350;border-radius:10px;padding:12px}
.pipeline-col-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pipeline-col-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.pipeline-col-count{border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700}
.pipeline-card{background:#161B27;border:1px solid #2A3350;border-radius:7px;padding:10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.pipeline-card:hover{border-color:#C8A84B}
.pipeline-card-name{font-weight:700;font-size:13px;color:#E2E8F0}
.pipeline-card-co{font-size:11px;color:#64748B}
.pipeline-card-owner{font-size:10px;color:#94A3B8;margin-top:4px}
/* Dashboard */
.stat-grid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.stat-box{background:#1C2333;border:1px solid #2A3350;border-radius:10px;padding:16px 20px;flex:1;min-width:120px}
.stat-val{font-size:28px;font-weight:800}
.stat-label{font-size:12px;color:#94A3B8;margin-top:2px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dash-card{background:#1C2333;border:1px solid #2A3350;border-radius:10px;padding:20px}
.dash-card h3{font-size:14px;color:#E2E8F0;margin-bottom:14px}
.dash-card.alert{border-color:rgba(239,68,68,.27)}
.dash-card.alert h3{color:#EF4444}
.pipeline-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pipeline-bar-label{width:100px;font-size:12px;color:#94A3B8}
.pipeline-bar-track{flex:1;height:8px;background:#161B27;border-radius:4px;overflow:hidden}
.pipeline-bar-fill{height:100%;border-radius:4px}
.pipeline-bar-val{width:24px;font-size:12px;color:#E2E8F0;text-align:right;font-weight:700}
/* Timeline items */
.timeline-item{display:flex;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #2A3350}
.timeline-icon{font-size:18px;flex-shrink:0}
.timeline-title{font-size:13px;color:#E2E8F0;font-weight:600}
.timeline-date{font-size:11px;color:#64748B}
.timeline-body{font-size:12px;color:#94A3B8;margin-top:3px}
.timeline-next{font-size:12px;color:#C8A84B;margin-top:2px}
/* List rows */
.list-row{background:#1C2333;border:1px solid #2A3350;border-radius:10px;padding:16px;margin-bottom:12px}
.list-row-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.list-row-title{font-weight:700;font-size:15px;color:#E2E8F0}
.list-row-meta{font-size:12px;color:#64748B}
.list-row-body{margin-top:8px;font-size:13px;color:#94A3B8}
.list-row-next{margin-top:4px;font-size:12px;color:#C8A84B}
.list-row-attach{margin-top:4px;font-size:11px;color:#64748B}
.list-row-link{font-size:12px;color:#3B82F6;cursor:pointer;margin-top:4px;display:block}
/* File cards */
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.file-card{background:#1C2333;border:1px solid #2A3350;border-radius:10px;padding:14px}
.file-card-header{display:flex;gap:10px;align-items:center;margin-bottom:6px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#1C2333;border:1px solid #2A3350;border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:28px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h2{font-size:17px;color:#E2E8F0;font-weight:700}
.modal-close{background:transparent;border:none;cursor:pointer;color:#94A3B8;font-size:18px;padding:4px 8px}
/* Detail panel */
.detail-header{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.detail-avatar{width:52px;height:52px;border-radius:50%;background:#C8A84B;display:flex;align-items:center;justify-content:center;color:#0E1117;font-weight:800;font-size:20px;flex-shrink:0}
.detail-name{font-size:20px;font-weight:800;color:#E2E8F0}
.detail-sub{font-size:14px;color:#94A3B8;margin-top:2px}
.detail-links{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.detail-notes{color:#94A3B8;font-size:13px;margin-bottom:16px;line-height:1.6;background:#161B27;padding:10px;border-radius:8px}
.detail-actions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
/* Tabs */
.tabs{border-bottom:1px solid #2A3350;margin-bottom:16px;display:flex}
.tab{background:transparent;border:none;cursor:pointer;padding:8px 16px;color:#94A3B8;font-weight:500;font-size:13px;border-bottom:2px solid transparent;font-family:inherit;transition:all .15s}
.tab.active{color:#C8A84B;font-weight:700;border-bottom-color:#C8A84B}
/* Empty */
.empty{text-align:center;padding:60px;color:#64748B}
.empty-icon{font-size:40px;margin-bottom:12px}
/* Alert row */
.alert-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #2A3350}
.alert-date{font-size:12px;color:#EF4444;font-weight:700;flex-shrink:0;margin-left:12px}
/* Recent meeting row */
.recent-row{display:flex;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #2A3350}
@media(max-width:700px){
  #sidebar{width:56px;padding:12px 6px}
  .nav-item span{display:none}
  .nav-logo-title,.nav-logo-sub,.sync-section{display:none}
  #main{padding:16px}
  .dash-grid{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .modal-box{max-width:100%}
}
</style>
</head>

// ── State ────────────────────────────────────────────────────────────────
let state = { contacts:[], meetings:[], emails:[], files:[] };
let currentView = 'dashboard';
let searchQ = '';
let stageFilter = 'All';

function loadState() {
  try {
    const seeded = localStorage.getItem('crm_kings_seeded');
    if (!seeded) {
      state = JSON.parse(JSON.stringify(SEED));
      saveLocal();
      localStorage.setItem('crm_kings_seeded','1');
    } else {
      state.contacts = JSON.parse(localStorage.getItem('crm_contacts')||'[]');
      state.meetings = JSON.parse(localStorage.getItem('crm_meetings')||'[]');
      state.emails   = JSON.parse(localStorage.getItem('crm_emails')||'[]');
      state.files    = JSON.parse(localStorage.getItem('crm_files')||'[]');
    }
  } catch(e) { state = JSON.parse(JSON.stringify(SEED)); }
}
function saveLocal() {
  localStorage.setItem('crm_contacts', JSON.stringify(state.contacts));
  localStorage.setItem('crm_meetings', JSON.stringify(state.meetings));
  localStorage.setItem('crm_emails',   JSON.stringify(state.emails));
  localStorage.setItem('crm_files',    JSON.stringify(state.files));
}

// ── Helpers ───────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const initials = n => (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tag = (label,color='#3B82F6') => `<span class="tag" style="background:${color}22;color:${color};border:1px solid ${color}44">${esc(label)}</span>`;
const contactName = id => { const c = state.contacts.find(x=>x.id===id); return c ? `${c.name} · ${c.company}` : '—'; };

// ── Navigation ────────────────────────────────────────────────────────────
function setView(v) {
  currentView = v;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-'+v)?.classList.add('active');
  const titles = {dashboard:'Dashboard',contacts:'Contacts',pipeline:'Pipeline',meetings:'Meetings',emails:'Email log',files:'Files shared'};
  document.getElementById('page-title').textContent = titles[v];
  renderTopbar();
  renderContent();
}

function renderTopbar() {
  const el = document.getElementById('topbar-actions');
  let html = '';
  if (currentView === 'contacts') {
    html += `<input class="search-input" placeholder="Search contacts…" value="${esc(searchQ)}" oninput="searchQ=this.value;renderContent()">`;
    html += `<select class="stage-select" onchange="stageFilter=this.value;renderContent()">`;
    html += `<option ${stageFilter==='All'?'selected':''}>All</option>`;
    STAGES.forEach(s => html += `<option ${stageFilter===s?'selected':''}>${s}</option>`);
    html += `</select>`;
    html += `<button class="btn btn-sm" onclick="openContactModal()">+ Contact</button>`;
  }
  if (currentView === 'meetings') html += `<button class="btn btn-sm" onclick="openMeetingModal()">+ Meeting</button>`;
  if (currentView === 'emails')   html += `<button class="btn btn-sm" onclick="openEmailModal()">+ Email</button>`;
  if (currentView === 'files')    html += `<button class="btn btn-sm" onclick="openFileModal()">+ File</button>`;
  el.innerHTML = html;
}

// ── Render content ─────────────────────────────────────────────────────────
function renderContent() {
  const el = document.getElementById('content');
  if (currentView === 'dashboard') el.innerHTML = renderDashboard();
  else if (currentView === 'contacts') el.innerHTML = renderContacts();
  else if (currentView === 'pipeline') el.innerHTML = renderPipeline();
  else if (currentView === 'meetings') el.innerHTML = renderMeetings();
  else if (currentView === 'emails')   el.innerHTML = renderEmails();
  else if (currentView === 'files')    el.innerHTML = renderFiles();
}

// ── Dashboard ──────────────────────────────────────────────────────────────
function renderDashboard() {
  const pending = state.emails.filter(e => e.followUpDate && e.followUpDate >= today() && e.status==='Sent');
  const recent = [...state.meetings].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  let html = `<div class="stat-grid">`;
  const stats = [
    ['Total contacts', state.contacts.length, '#C8A84B'],
    ['Meetings logged', state.meetings.length, '#3B82F6'],
    ['Emails tracked', state.emails.length, '#A855F7'],
    ['Files shared', state.files.length, '#22C55E'],
    ['Follow-ups due', pending.length, '#EF4444'],
  ];
  stats.forEach(([l,v,c]) => html += `<div class="stat-box"><div class="stat-val" style="color:${c}">${v}</div><div class="stat-label">${l}</div></div>`);
  html += `</div><div class="dash-grid">`;
  // Pipeline bars
  html += `<div class="dash-card"><h3>Pipeline</h3>`;
  const total = state.contacts.length || 1;
  STAGES.forEach(s => {
    const n = state.contacts.filter(c=>c.stage===s).length;
    html += `<div class="pipeline-bar-row">
      <div class="pipeline-bar-label" style="color:#94A3B8;font-size:12px">${s}</div>
      <div class="pipeline-bar-track"><div class="pipeline-bar-fill" style="width:${n/total*100}%;background:${STAGE_COLOR[s]}"></div></div>
      <div class="pipeline-bar-val">${n}</div></div>`;
  });
  html += `</div>`;
  // Recent meetings
  html += `<div class="dash-card"><h3>Recent meetings</h3>`;
  if (!recent.length) html += `<p style="color:#64748B;font-size:13px">No meetings yet.</p>`;
  recent.forEach(m => {
    html += `<div class="recent-row"><div style="font-size:18px">📅</div><div>
      <div style="font-size:13px;font-weight:600;color:#E2E8F0">${esc(m.title)}</div>
      <div style="font-size:11px;color:#64748B">${fmtDate(m.date)} · ${esc(m.type)}</div>
    </div></div>`;
  });
  html += `</div>`;
  // Follow-ups
  if (pending.length) {
    html += `<div class="dash-card alert" style="grid-column:span 2"><h3>⚠️ Pending follow-ups</h3>`;
    pending.forEach(e => {
      const c = state.contacts.find(x=>x.id===e.contactId);
      html += `<div class="alert-row">
        <div><div style="font-size:13px;color:#E2E8F0;font-weight:600">${esc(e.subject)}</div>
        ${c?`<div style="font-size:11px;color:#64748B">${esc(c.name)} · ${esc(c.company)}</div>`:''}
        </div><div class="alert-date">${fmtDate(e.followUpDate)}</div></div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

// ── Contacts ───────────────────────────────────────────────────────────────
function renderContacts() {
  const q = searchQ.toLowerCase();
  const filtered = state.contacts.filter(c => {
    const mq = !q || (c.name||'').toLowerCase().includes(q) || (c.company||'').toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q) || (c.role||'').toLowerCase().includes(q);
    const ms = stageFilter==='All' || c.stage===stageFilter;
    return mq && ms;
  });
  if (!filtered.length) return `<div class="empty"><div class="empty-icon">👥</div><p>No contacts found.</p></div>`;
  let html = `<div class="contact-grid">`;
  filtered.forEach(c => {
    const nm = state.meetings.filter(m=>m.contactId===c.id).length;
    const ne = state.emails.filter(e=>e.contactId===c.id).length;
    const nf = state.files.filter(f=>f.contactId===c.id).length;
    html += `<div class="contact-card" onclick="openDetail('${c.id}')">
      <div class="contact-card-header">
        <div class="avatar">${initials(c.name)}</div>
        <div style="flex:1;min-width:0">
          <div class="contact-name">${esc(c.name)}</div>
          <div class="contact-sub">${esc(c.role)}${c.role&&c.company?' · ':''}${esc(c.company)}</div>
        </div>
        ${tag(c.stage, STAGE_COLOR[c.stage])}
      </div>
      ${c.email?`<a class="contact-email" href="mailto:${esc(c.email)}" onclick="event.stopPropagation()">${esc(c.email)}</a>`:''}
      ${c.owner?`<div class="contact-owner">Owner: ${esc(c.owner)}</div>`:''}
      <div class="contact-stats">
        <span>📅 ${nm}</span><span>✉️ ${ne}</span><span>📄 ${nf}</span>
      </div>
    </div>`;
  });
  return html + '</div>';
}

// ── Pipeline ───────────────────────────────────────────────────────────────
function renderPipeline() {
  let html = `<div class="pipeline">`;
  STAGES.forEach(s => {
    const items = state.contacts.filter(c=>c.stage===s);
    html += `<div class="pipeline-col">
      <div class="pipeline-col-header">
        <span class="pipeline-col-label" style="color:${STAGE_COLOR[s]}">${s}</span>
        <span class="pipeline-col-count" style="background:${STAGE_COLOR[s]}22;color:${STAGE_COLOR[s]}">${items.length}</span>
      </div>`;
    if (!items.length) html += `<p style="color:#64748B;font-size:12px;text-align:center;margin:20px 0">Empty</p>`;
    items.forEach(c => {
      html += `<div class="pipeline-card" onclick="openDetail('${c.id}')">
        <div class="pipeline-card-name">${esc(c.name)}</div>
        <div class="pipeline-card-co">${esc(c.company)}</div>
        ${c.owner?`<div class="pipeline-card-owner">Owner: ${esc(c.owner)}</div>`:''}
      </div>`;
    });
    html += `</div>`;
  });
  return html + '</div>';
}

// ── Meetings ───────────────────────────────────────────────────────────────
function renderMeetings() {
  const sorted = [...state.meetings].sort((a,b)=>b.date.localeCompare(a.date));
  if (!sorted.length) return `<div class="empty"><div class="empty-icon">📅</div><p>No meetings logged yet.</p></div>`;
  return sorted.map(m => {
    const c = state.contacts.find(x=>x.id===m.contactId);
    return `<div class="list-row">
      <div class="list-row-head">
        <div>
          <div class="list-row-title">${esc(m.title)}</div>
          ${c?`<div class="list-row-link" onclick="openDetail('${c.id}')">👤 ${esc(c.name)} · ${esc(c.company)}</div>`:''}
        </div>
        <div style="text-align:right">

// ── Contact Detail ─────────────────────────────────────────────────────────
let detailTab = 'timeline';
function openDetail(id) {
  const c = state.contacts.find(x=>x.id===id);

function renderDetail(c) {
  const myM = state.meetings.filter(m=>m.contactId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  const myE = state.emails.filter(e=>e.contactId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  const myF = state.files.filter(f=>f.contactId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  const timeline = [...myM.map(x=>({...x,_t:'meeting'})),...myE.map(x=>({...x,_t:'email'})),...myF.map(x=>({...x,_t:'file'}))].sort((a,b)=>b.date.localeCompare(a.date));

  let html = `<div class="detail-header">
    <div class="detail-avatar">${initials(c.name)}</div>
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="detail-name">${esc(c.name)}</span>
        ${tag(c.stage,STAGE_COLOR[c.stage])}
      </div>
      <div class="detail-sub">${esc(c.role)}${c.role&&c.company?' · ':''}${esc(c.company)}</div>
      ${c.email?`<a href="mailto:${esc(c.email)}" style="color:#3B82F6;font-size:13px">${esc(c.email)}</a>`:''}
      ${c.tags?`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${c.tags.split(',').map(t=>t.trim()).filter(Boolean).map(t=>tag(t,'#64748B')).join('')}</div>`:''}
    </div>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button class="btn btn-sm-ghost" onclick="editContact('${c.id}')">Edit</button>
      <button class="btn btn-danger" onclick="deleteContact('${c.id}')">Delete</button>
    </div>
  </div>`;

  if (c.linkedIn || c.website) {
    html += `<div class="detail-links">`;
    if (c.linkedIn) html += `<a href="${esc(c.linkedIn)}" target="_blank" style="font-size:12px">🔗 LinkedIn</a>`;
    if (c.website)  html += `<a href="${esc(c.website)}" target="_blank" style="font-size:12px">🌐 ${esc(c.website.replace(/^https?:\/\//,''))}</a>`;
    html += `</div>`;
  }
  if (c.notes) html += `<div class="detail-notes">${esc(c.notes)}</div>`;

  html += `<div class="detail-actions">
    <button class="btn btn-sm" onclick="openMeetingModal('${c.id}')">+ Meeting</button>
    <button class="btn btn-sm" onclick="openEmailModal('${c.id}')">+ Email</button>
    <button class="btn btn-sm" onclick="openFileModal('${c.id}')">+ File</button>
  </div>`;

  html += `<div class="tabs">
    ${['timeline','meetings','emails','files'].map(t => {
      const count = t==='meetings'?myM.length:t==='emails'?myE.length:t==='files'?myF.length:null;
      const label = t==='timeline'?'Timeline':t.charAt(0).toUpperCase()+t.slice(1)+(count!==null?` (${count})`:'');
      return `<button class="tab ${detailTab===t?'active':''}" onclick="switchTab('${c.id}','${t}')">${label}</button>`;
    }).join('')}
  </div>`;

  html += `<div id="detail-tab-content">`;
  if (detailTab === 'timeline') {
    if (!timeline.length) html += `<p style="color:#64748B;font-size:13px">No activity yet.</p>`;
    timeline.forEach(item => {
      const icon = item._t==='meeting'?'📅':item._t==='email'?'✉️':'📄';
      const title = item.title||item.subject||item.name;
      const sc = item.status==='Replied'?'#22C55E':item.status==='No response'?'#EF4444':'#3B82F6';
      html += `<div class="timeline-item">
        <div class="timeline-icon">${icon}</div>
        <div>
          <div class="timeline-title">${esc(title)}</div>
          <div class="timeline-date">${fmtDate(item.date)}</div>
          ${item.outcome?`<div class="timeline-body">${esc(item.outcome)}</div>`:''}

          ${item.status?tag(item.status,sc):''}

    });
  } else if (detailTab === 'meetings') {
    if (!myM.length) html += `<p style="color:#64748B;font-size:13px">No meetings logged.</p>`;
    myM.forEach(m => {
      html += `<div style="background:#161B27;border-radius:8px;padding:12px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between">
          <span style="font-weight:700;color:#E2E8F0;font-size:14px">${esc(m.title)}</span>
          <span style="font-size:11px;color:#64748B">${fmtDate(m.date)} · ${esc(m.type)}</span>

        ${m.attachments?`<p style="margin:4px 0 0;font-size:11px;color:#64748B">📎 ${esc(m.attachments)}</p>`:''}
      </div>`;
    });
  } else if (detailTab === 'emails') {
    if (!myE.length) html += `<p style="color:#64748B;font-size:13px">No emails logged.</p>`;
    myE.forEach(e => {
      const sc = e.status==='Replied'?'#22C55E':e.status==='No response'?'#EF4444':'#3B82F6';
      html += `<div style="background:#161B27;border-radius:8px;padding:12px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px">

          ${tag(e.status,sc)}

        <div style="font-size:11px;color:#64748B;margin-top:3px">${fmtDate(e.date)}</div>
        ${e.body?`<p style="margin:6px 0 0;font-size:13px;color:#94A3B8">${esc(e.body)}</p>`:''}
        ${e.followUpDate?`<p style="margin:4px 0 0;font-size:11px;color:#C8A84B">Follow-up: ${fmtDate(e.followUpDate)}</p>`:''}
      </div>`;
    });
  } else if (detailTab === 'files') {
    if (!myF.length) html += `<p style="color:#64748B;font-size:13px">No files logged.</p>`;
    myF.forEach(f => {
      html += `<div style="background:#161B27;border-radius:8px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center">
        <span style="font-size:22px">📄</span>
        <div style="flex:1">
          ${f.url?`<a href="${esc(f.url)}" target="_blank" style="font-weight:700;font-size:14px;color:#3B82F6">${esc(f.name)}</a>`
                 :`<span style="font-weight:700;font-size:14px;color:#E2E8F0">${esc(f.name)}</span>`}
          <div style="font-size:11px;color:#64748B;margin-top:2px">${fmtDate(f.date)} · ${tag(f.tag,'#64748B')}</div>
          ${f.notes?`<p style="margin:4px 0 0;font-size:12px;color:#94A3B8">${esc(f.notes)}</p>`:''}
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

// ── Google Drive Sync ──────────────────────────────────────────────────────
function setSyncStatus(status, msg) {
  const msgEl = document.getElementById('sync-msg');
  const saveBtn = document.getElementById('sync-save-btn');
  const loadBtn = document.getElementById('sync-load-btn');
  const colors = {ok:'#22C55E',error:'#EF4444',saving:'#C8A84B',loading:'#C8A84B',idle:'#64748B'};
  msgEl.style.color = colors[status]||'#64748B';
  msgEl.textContent = msg;
  const busy = status==='saving'||status==='loading';
  saveBtn.disabled = loadBtn.disabled = busy;
  saveBtn.textContent = status==='saving'?'Saving…':'⬆ Save to Drive';
  loadBtn.textContent = status==='loading'?'Loading…':'⬇ Load from Drive';
}

async function saveToDrive() {
  setSyncStatus('saving','Saving to Google Drive…');
  try {
    const payload = JSON.stringify(state, null, 2);
    const storedId = localStorage.getItem(DRIVE_FILE_ID_KEY);
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:500,
        mcp_servers:[{type:'url',url:'https://drivemcp.googleapis.com/mcp/v1',name:'gdrive'}],
        messages:[{role:'user',content:`You manage a Google Drive file. Do exactly this:
1. Search for a file named "${DRIVE_FILE_NAME}" in folder id "${DRIVE_FOLDER_ID}".
2. If found, update it with the content below. If not found, create it in folder "${DRIVE_FOLDER_ID}".
3. Reply with ONLY this JSON: {"fileId":"<id>","action":"created" or "updated"}
No other text.

Content:
${payload}`}]
      })
    });
    const data = await resp.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const match = text.match(/\{[^}]*"fileId"[^}]*\}/);
    if (match) {
      const result = JSON.parse(match[0]);
      localStorage.setItem(DRIVE_FILE_ID_KEY, result.fileId);
      setSyncStatus('ok',`✓ Saved (${result.action})`);
    } else throw new Error('Unexpected response');
  } catch(e) { setSyncStatus('error','Save failed: '+e.message.slice(0,60)); }
  setTimeout(()=>setSyncStatus('idle',''),4000);
}

async function loadFromDrive() {
  setSyncStatus('loading','Loading from Drive…');
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:16000,
        mcp_servers:[{type:'url',url:'https://drivemcp.googleapis.com/mcp/v1',name:'gdrive'}],
        messages:[{role:'user',content:`Read the file named "${DRIVE_FILE_NAME}" from Google Drive folder "${DRIVE_FOLDER_ID}". Reply with ONLY the raw JSON file content. No explanation, no markdown, no backticks.`}]
      })
    });
    const data = await resp.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if (parsed.contacts) {
      state = parsed;
      saveLocal();
      localStorage.setItem('crm_kings_seeded','1');
      setSyncStatus('ok',`✓ Loaded ${parsed.contacts.length} contacts`);
      renderContent();
    } else throw new Error('Invalid data format');
  } catch(e) { setSyncStatus('error','Load failed: '+e.message.slice(0,60)); }
  setTimeout(()=>setSyncStatus('idle',''),4000);
}

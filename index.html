.sync-section{padding:12px 4px;margin-top:auto}

.sync-btn-primary{background:#C8A84B;color:#0E1117}
.sync-btn-secondary{background:transparent;color:#94A3B8;border:1px solid #2A3350;font-weight:600}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}

.file-card{background:#1C2333;border:1px solid #2A3350;border-radius:10px;padding:14px}

// ── State ─────────────────────────────────────────────────────────────────
let state = {contacts:[],meetings:[],emails:[],files:[]};
let currentView = 'dashboard';
let searchQ = '', stageFilter = 'All', detailTab = 'timeline';
let accessToken = null;
let driveFileId = localStorage.getItem('crm_drive_file_id') || null;

function loadState(){
  try {
    const seeded = localStorage.getItem('crm_kings_seeded');
    if (!seeded) {
      state = JSON.parse(JSON.stringify(SEED));
      saveLocal();
      localStorage.setItem('crm_kings_seeded','1');
    } else {
      state.contacts = JSON.parse(localStorage.getItem('crm_contacts')||'[]');
      state.meetings = JSON.parse(localStorage.getItem('crm_meetings')||'[]');
      state.emails   = JSON.parse(localStorage.getItem('crm_emails')||'[]');
      state.files    = JSON.parse(localStorage.getItem('crm_files')||'[]');
    }
  } catch(e) { state = JSON.parse(JSON.stringify(SEED)); }
}
function saveLocal(){
  localStorage.setItem('crm_contacts', JSON.stringify(state.contacts));
  localStorage.setItem('crm_meetings', JSON.stringify(state.meetings));
  localStorage.setItem('crm_emails',   JSON.stringify(state.emails));
  localStorage.setItem('crm_files',    JSON.stringify(state.files));
}

// ── Google OAuth ──────────────────────────────────────────────────────────
let tokenClient;
window.addEventListener('load', () => {
  // Try to restore token from session
  const stored = sessionStorage.getItem('crm_access_token');
  if (stored) { accessToken = stored; updateAuthUI(true); }
});

function initGoogleAuth() {
  if (!window.google) { setTimeout(initGoogleAuth, 500); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) { setSyncMsg('Auth error: ' + resp.error, 'error'); return; }
      accessToken = resp.access_token;
      sessionStorage.setItem('crm_access_token', accessToken);
      updateAuthUI(true);
      setSyncMsg('✓ Signed in', 'ok');
      setTimeout(()=>setSyncMsg('','idle'),3000);
    }
  });
}

function signIn() {
  if (!tokenClient) { initGoogleAuth(); setTimeout(signIn, 600); return; }
  tokenClient.requestAccessToken();
}
function signOut() {
  if (accessToken && window.google) google.accounts.oauth2.revoke(accessToken);
  accessToken = null;
  sessionStorage.removeItem('crm_access_token');
  updateAuthUI(false);
}
function updateAuthUI(signedIn) {
  document.getElementById('sync-signin-btn').style.display = signedIn ? 'none' : 'block';
  document.getElementById('sync-save-btn').style.display   = signedIn ? 'block' : 'none';
  document.getElementById('sync-load-btn').style.display   = signedIn ? 'block' : 'none';
  document.getElementById('sync-signout-btn').style.display= signedIn ? 'block' : 'none';
  const userEl = document.getElementById('sync-user');
  userEl.style.display = signedIn ? 'block' : 'none';
  userEl.textContent = signedIn ? '● Connected' : '';
}

// ── Drive API calls ───────────────────────────────────────────────────────
async function driveRequest(url, options={}) {
  const resp = await fetch(url, {
    ...options,
    headers: { 'Authorization': 'Bearer ' + accessToken, ...(options.headers||{}) }
  });
  if (resp.status === 401) { signOut(); throw new Error('Session expired – please sign in again'); }
  return resp;
}

async function findDriveFile() {
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and '${DRIVE_FOLDER_ID}' in parents and trashed=false`);
  const resp = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await resp.json();
  return data.files && data.files.length > 0 ? data.files[0].id : null;
}

async function saveToDrive() {
  if (!accessToken) { setSyncMsg('Please sign in first', 'error'); return; }
  setSyncMsg('Saving…', 'saving');
  try {
    const payload = JSON.stringify(state, null, 2);
    const blob = new Blob([payload], {type: 'application/json'});

    // Find existing file or create new
    let fileId = driveFileId || await findDriveFile();
    let url, method;

    if (fileId) {
      url = `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`;
      method = 'PATCH';
    } else {
      // Create with metadata first
      const meta = await driveRequest('https://www.googleapis.com/drive/v3/files', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name: DRIVE_FILE_NAME, parents: [DRIVE_FOLDER_ID]})
      });
      const metaData = await meta.json();
      fileId = metaData.id;
      url = `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`;
      method = 'PATCH';
    }

    await driveRequest(url, { method, headers:{'Content-Type':'application/json'}, body: blob });
    driveFileId = fileId;
    localStorage.setItem('crm_drive_file_id', fileId);
    setSyncMsg('✓ Saved to Drive', 'ok');
  } catch(e) { setSyncMsg('Failed: ' + e.message.slice(0,60), 'error'); }
  setTimeout(()=>setSyncMsg('','idle'), 4000);
}

async function loadFromDrive() {
  if (!accessToken) { setSyncMsg('Please sign in first', 'error'); return; }
  setSyncMsg('Loading…', 'loading');
  try {
    const fileId = driveFileId || await findDriveFile();
    if (!fileId) { setSyncMsg('No saved data found in Drive', 'error'); return; }
    const resp = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const data = await resp.json();
    if (data.contacts) {
      state = data;
      driveFileId = fileId;
      localStorage.setItem('crm_drive_file_id', fileId);
      saveLocal();
      localStorage.setItem('crm_kings_seeded','1');
      setSyncMsg(`✓ Loaded ${data.contacts.length} contacts`, 'ok');
      renderContent();
    } else throw new Error('Invalid data format');
  } catch(e) { setSyncMsg('Failed: ' + e.message.slice(0,60), 'error'); }
  setTimeout(()=>setSyncMsg('','idle'), 4000);
}

function setSyncMsg(msg, status='idle') {
  const el = document.getElementById('sync-msg');
  const colors = {ok:'#22C55E', error:'#EF4444', saving:'#C8A84B', loading:'#C8A84B', idle:'#64748B'};
  el.style.color = colors[status] || '#64748B';
  el.textContent = msg;
  const busy = status==='saving' || status==='loading';
  const sb = document.getElementById('sync-save-btn');
  const lb = document.getElementById('sync-load-btn');
  if(sb){ sb.disabled = busy; sb.textContent = status==='saving' ? 'Saving…' : '⬆ Save to Drive'; }
  if(lb){ lb.disabled = busy; lb.textContent = status==='loading' ? 'Loading…' : '⬇ Load from Drive'; }
}

function setView(v){currentView=v;document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));document.getElementById('nav-'+v)?.classList.add('active');const t={dashboard:'Dashboard',contacts:'Contacts',pipeline:'Pipeline',meetings:'Meetings',emails:'Email log',files:'Files shared'};document.getElementById('page-title').textContent=t[v];renderTopbar();renderContent();}
function renderTopbar(){const el=document.getElementById('topbar-actions');let h='';if(currentView==='contacts'){h+=`<input class="search-input" placeholder="Search contacts…" value="${esc(searchQ)}" oninput="searchQ=this.value;renderContent()">`;h+=`<select class="stage-select" onchange="stageFilter=this.value;renderContent()"><option ${stageFilter==='All'?'selected':''}>All</option>${STAGES.map(s=>`<option ${stageFilter===s?'selected':''}>${s}</option>`).join('')}</select>`;h+=`<button class="btn btn-sm" onclick="openContactModal()">+ Contact</button>`;}if(currentView==='meetings')h+=`<button class="btn btn-sm" onclick="openMeetingModal()">+ Meeting</button>`;if(currentView==='emails')h+=`<button class="btn btn-sm" onclick="openEmailModal()">+ Email</button>`;if(currentView==='files')h+=`<button class="btn btn-sm" onclick="openFileModal()">+ File</button>`;el.innerHTML=h;}

function renderContent(){const el=document.getElementById('content');if(currentView==='dashboard')el.innerHTML=renderDashboard();else if(currentView==='contacts')el.innerHTML=renderContacts();else if(currentView==='pipeline')el.innerHTML=renderPipeline();else if(currentView==='meetings')el.innerHTML=renderMeetings();else if(currentView==='emails')el.innerHTML=renderEmails();else if(currentView==='files')el.innerHTML=renderFiles();}
function renderDashboard(){const pend=state.emails.filter(e=>e.followUpDate&&e.followUpDate>=today()&&e.status==='Sent');const rec=[...state.meetings].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);let h=`<div class="stat-grid">`;[['Total contacts',state.contacts.length,'#C8A84B'],['Meetings',state.meetings.length,'#3B82F6'],['Emails',state.emails.length,'#A855F7'],['Files',state.files.length,'#22C55E'],['Follow-ups due',pend.length,'#EF4444']].forEach(([l,v,c])=>h+=`<div class="stat-box"><div class="stat-val" style="color:${c}">${v}</div><div class="stat-label">${l}</div></div>`);h+=`</div><div class="dash-grid"><div class="dash-card"><h3>Pipeline</h3>`;const tot=state.contacts.length||1;STAGES.forEach(s=>{const n=state.contacts.filter(c=>c.stage===s).length;h+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="width:100px;font-size:12px;color:#94A3B8">${s}</div><div style="flex:1;height:8px;background:#161B27;border-radius:4px;overflow:hidden"><div style="height:100%;background:${STAGE_COLOR[s]};width:${n/tot*100}%;border-radius:4px"></div></div><div style="width:24px;font-size:12px;color:#E2E8F0;text-align:right;font-weight:700">${n}</div></div>`;});h+=`</div><div class="dash-card"><h3>Recent meetings</h3>`;if(!rec.length)h+=`<p style="color:#64748B;font-size:13px">No meetings yet.</p>`;rec.forEach(m=>h+=`<div style="display:flex;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #2A3350"><div style="font-size:18px">📅</div><div><div style="font-size:13px;font-weight:600;color:#E2E8F0">${esc(m.title)}</div><div style="font-size:11px;color:#64748B">${fmtDate(m.date)} · ${esc(m.type)}</div></div></div>`);h+=`</div>`;if(pend.length){h+=`<div class="dash-card" style="grid-column:span 2;border-color:rgba(239,68,68,.27)"><h3 style="color:#EF4444">⚠️ Pending follow-ups</h3>`;pend.forEach(e=>{const c=state.contacts.find(x=>x.id===e.contactId);h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #2A3350"><div><div style="font-size:13px;color:#E2E8F0;font-weight:600">${esc(e.subject)}</div>${c?`<div style="font-size:11px;color:#64748B">${esc(c.name)} · ${esc(c.company)}</div>`:''}</div><div style="font-size:12px;color:#EF4444;font-weight:700;margin-left:12px">${fmtDate(e.followUpDate)}</div></div>`;});h+=`</div>`;}return h+`</div>`;}
function renderContacts(){const q=searchQ.toLowerCase();const fil=state.contacts.filter(c=>{const mq=!q||(c.name||'').toLowerCase().includes(q)||(c.company||'').toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q);const ms=stageFilter==='All'||c.stage===stageFilter;return mq&&ms;});if(!fil.length)return`<div class="empty"><div style="font-size:40px;margin-bottom:12px">👥</div><p>No contacts found.</p></div>`;let h=`<div class="contact-grid">`;fil.forEach(c=>{const nm=state.meetings.filter(m=>m.contactId===c.id).length,ne=state.emails.filter(e=>e.contactId===c.id).length,nf=state.files.filter(f=>f.contactId===c.id).length;h+=`<div class="contact-card" onclick="openDetail('${c.id}')"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${initials(c.name)}</div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px;color:#E2E8F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div><div style="font-size:12px;color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.role)}${c.role&&c.company?' · ':''}${esc(c.company)}</div></div>${tag(c.stage,STAGE_COLOR[c.stage])}</div>${c.email?`<a style="font-size:12px;color:#3B82F6;margin-top:8px;display:block" href="mailto:${esc(c.email)}" onclick="event.stopPropagation()">${esc(c.email)}</a>`:''}${c.owner?`<div style="font-size:11px;color:#94A3B8;margin-top:4px">Owner: ${esc(c.owner)}</div>`:''}<div style="display:flex;gap:8px;margin-top:8px"><span style="font-size:11px;color:#64748B">📅 ${nm}</span><span style="font-size:11px;color:#64748B">✉️ ${ne}</span><span style="font-size:11px;color:#64748B">📄 ${nf}</span></div></div>`;});return h+`</div>`;}
function renderPipeline(){let h=`<div class="pipeline">`;STAGES.forEach(s=>{const items=state.contacts.filter(c=>c.stage===s);h+=`<div class="pipeline-col"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-size:11px;font-weight:700;text-transform:uppercase;color:${STAGE_COLOR[s]}">${s}</span><span style="background:${STAGE_COLOR[s]}22;color:${STAGE_COLOR[s]};border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700">${items.length}</span></div>`;if(!items.length)h+=`<p style="color:#64748B;font-size:12px;text-align:center;margin:20px 0">Empty</p>`;items.forEach(c=>h+=`<div class="pipeline-card" onclick="openDetail('${c.id}')"><div style="font-weight:700;font-size:13px;color:#E2E8F0">${esc(c.name)}</div><div style="font-size:11px;color:#64748B">${esc(c.company)}</div>${c.owner?`<div style="font-size:10px;color:#94A3B8;margin-top:4px">Owner: ${esc(c.owner)}</div>`:''}</div>`);h+=`</div>`;});return h+`</div>`;}
function renderMeetings(){const s=[...state.meetings].sort((a,b)=>b.date.localeCompare(a.date));if(!s.length)return`<div class="empty"><div style="font-size:40px;margin-bottom:12px">📅</div><p>No meetings logged.</p></div>`;return s.map(m=>{const c=state.contacts.find(x=>x.id===m.contactId);return`<div class="list-row"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px"><div><div style="font-weight:700;font-size:15px;color:#E2E8F0">${esc(m.title)}</div>${c?`<div style="font-size:12px;color:#3B82F6;cursor:pointer;margin-top:4px" onclick="openDetail('${c.id}')">👤 ${esc(c.name)} · ${esc(c.company)}</div>`:''}</div><div style="text-align:right"><div style="font-size:12px;color:#64748B">${fmtDate(m.date)}</div>${tag(m.type,'#64748B')}</div></div>${m.outcome?`<div style="margin-top:8px;font-size:13px;color:#94A3B8">${esc(m.outcome)}</div>`:''}${m.nextStep?`<div style="margin-top:4px;font-size:12px;color:#C8A84B">→ ${esc(m.nextStep)}</div>`:''}${m.attachments?`<div style="margin-top:4px;font-size:11px;color:#64748B">📎 ${esc(m.attachments)}</div>`:''}</div>`;}).join('');}
function renderEmails(){const s=[...state.emails].sort((a,b)=>b.date.localeCompare(a.date));if(!s.length)return`<div class="empty"><div style="font-size:40px;margin-bottom:12px">✉️</div><p>No emails logged.</p></div>`;return s.map(e=>{const c=state.contacts.find(x=>x.id===e.contactId);const sc=e.status==='Replied'?'#22C55E':e.status==='No response'?'#EF4444':'#3B82F6';return`<div class="list-row"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px"><div><div style="font-weight:700;font-size:15px;color:#E2E8F0">${esc(e.subject)}</div>${c?`<div style="font-size:12px;color:#3B82F6;cursor:pointer;margin-top:4px" onclick="openDetail('${c.id}')">👤 ${esc(c.name)} · ${esc(c.company)}</div>`:''}</div><div style="display:flex;gap:8px;align-items:center">${tag(e.status,sc)}<span style="font-size:12px;color:#64748B">${fmtDate(e.date)}</span></div></div>${e.body?`<div style="margin-top:8px;font-size:13px;color:#94A3B8">${esc(e.body)}</div>`:''}${e.followUpDate?`<div style="margin-top:4px;font-size:12px;color:#C8A84B">Follow-up: ${fmtDate(e.followUpDate)}</div>`:''}</div>`;}).join('');}
function renderFiles(){const s=[...state.files].sort((a,b)=>b.date.localeCompare(a.date));if(!s.length)return`<div class="empty"><div style="font-size:40px;margin-bottom:12px">📄</div><p>No files logged.</p></div>`;let h=`<div class="file-grid">`;s.forEach(f=>{const c=state.contacts.find(x=>x.id===f.contactId);h+=`<div class="file-card"><div style="display:flex;gap:10px;align-items:center;margin-bottom:6px"><span style="font-size:24px">📄</span><div>${f.url?`<a href="${esc(f.url)}" target="_blank" style="font-weight:700;font-size:14px;color:#3B82F6">${esc(f.name)}</a>`:`<span style="font-weight:700;font-size:14px;color:#E2E8F0">${esc(f.name)}</span>`}<div style="font-size:11px;color:#64748B">${fmtDate(f.date)}</div></div></div>${tag(f.tag,'#64748B')}${c?`<div style="font-size:12px;color:#3B82F6;cursor:pointer;margin-top:6px" onclick="openDetail('${c.id}')">→ ${esc(c.name)}</div>`:''}${f.notes?`<div style="font-size:12px;color:#94A3B8;margin-top:6px">${esc(f.notes)}</div>`:''}</div>`;});return h+`</div>`;}

// ── Detail panel ──────────────────────────────────────────────────────────
function openDetail(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;detailTab='timeline';showModal('detail-'+id,'',renderDetail(c));}
function renderDetail(c){const myM=state.meetings.filter(m=>m.contactId===c.id).sort((a,b)=>b.date.localeCompare(a.date));const myE=state.emails.filter(e=>e.contactId===c.id).sort((a,b)=>b.date.localeCompare(a.date));const myF=state.files.filter(f=>f.contactId===c.id).sort((a,b)=>b.date.localeCompare(a.date));const tl=[...myM.map(x=>({...x,_t:'meeting'})),...myE.map(x=>({...x,_t:'email'})),...myF.map(x=>({...x,_t:'file'}))].sort((a,b)=>b.date.localeCompare(a.date));let h=`<div style="display:flex;gap:16px;align-items:flex-start;margin-bottom:20px"><div style="width:52px;height:52px;border-radius:50%;background:#C8A84B;display:flex;align-items:center;justify-content:center;color:#0E1117;font-weight:800;font-size:20px;flex-shrink:0">${initials(c.name)}</div><div style="flex:1"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:20px;font-weight:800;color:#E2E8F0">${esc(c.name)}</span>${tag(c.stage,STAGE_COLOR[c.stage])}</div><div style="font-size:14px;color:#94A3B8;margin-top:2px">${esc(c.role)}${c.role&&c.company?' · ':''}${esc(c.company)}</div>${c.email?`<a href="mailto:${esc(c.email)}" style="color:#3B82F6;font-size:13px">${esc(c.email)}</a>`:''} ${c.tags?`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${c.tags.split(',').map(t=>t.trim()).filter(Boolean).map(t=>tag(t,'#64748B')).join('')}</div>`:''}</div><div style="display:flex;gap:8px;flex-shrink:0"><button class="btn btn-sm-ghost" onclick="editContact('${c.id}')">Edit</button><button class="btn-danger btn" onclick="deleteContact('${c.id}')">Delete</button></div></div>`;if(c.linkedIn||c.website)h+=`<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px">${c.linkedIn?`<a href="${esc(c.linkedIn)}" target="_blank" style="font-size:12px">🔗 LinkedIn</a>`:''}${c.website?`<a href="${esc(c.website)}" target="_blank" style="font-size:12px">🌐 ${esc(c.website.replace(/^https?:\/\//,''))}</a>`:''}</div>`;if(c.notes)h+=`<div style="color:#94A3B8;font-size:13px;margin-bottom:16px;line-height:1.6;background:#161B27;padding:10px;border-radius:8px">${esc(c.notes)}</div>`;h+=`<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap"><button class="btn btn-sm" onclick="openMeetingModal('${c.id}')">+ Meeting</button><button class="btn btn-sm" onclick="openEmailModal('${c.id}')">+ Email</button><button class="btn btn-sm" onclick="openFileModal('${c.id}')">+ File</button></div>`;h+=`<div class="tabs">${['timeline','meetings','emails','files'].map(t=>{const cnt=t==='meetings'?myM.length:t==='emails'?myE.length:t==='files'?myF.length:null;const lbl=t==='timeline'?'Timeline':t.charAt(0).toUpperCase()+t.slice(1)+(cnt!==null?` (${cnt})`:'');return`<button class="tab ${detailTab===t?'active':''}" onclick="switchTab('${c.id}','${t}')">${lbl}</button>`;}).join('')}</div><div id="detail-tab-content">`;if(detailTab==='timeline'){if(!tl.length)h+=`<p style="color:#64748B;font-size:13px">No activity yet.</p>`;tl.forEach(item=>{const ic=item._t==='meeting'?'📅':item._t==='email'?'✉️':'📄';const sc=item.status==='Replied'?'#22C55E':item.status==='No response'?'#EF4444':'#3B82F6';h+=`<div style="display:flex;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #2A3350"><div style="font-size:18px;flex-shrink:0">${ic}</div><div><div style="font-size:13px;color:#E2E8F0;font-weight:600">${esc(item.title||item.subject||item.name)}</div><div style="font-size:11px;color:#64748B">${fmtDate(item.date)}</div>${item.outcome?`<div style="font-size:12px;color:#94A3B8;margin-top:3px">${esc(item.outcome)}</div>`:''}${item.nextStep?`<div style="font-size:12px;color:#C8A84B;margin-top:2px">→ ${esc(item.nextStep)}</div>`:''}${item.status?tag(item.status,sc):''}</div></div>`;});}else if(detailTab==='meetings'){if(!myM.length)h+=`<p style="color:#64748B;font-size:13px">No meetings.</p>`;myM.forEach(m=>h+=`<div style="background:#161B27;border-radius:8px;padding:12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between"><span style="font-weight:700;color:#E2E8F0;font-size:14px">${esc(m.title)}</span><span style="font-size:11px;color:#64748B">${fmtDate(m.date)} · ${esc(m.type)}</span></div>${m.outcome?`<p style="margin:6px 0 0;font-size:13px;color:#94A3B8">${esc(m.outcome)}</p>`:''}${m.nextStep?`<p style="margin:4px 0 0;font-size:12px;color:#C8A84B">→ ${esc(m.nextStep)}</p>`:''}${m.attachments?`<p style="margin:4px 0 0;font-size:11px;color:#64748B">📎 ${esc(m.attachments)}</p>`:''}</div>`);}else if(detailTab==='emails'){if(!myE.length)h+=`<p style="color:#64748B;font-size:13px">No emails.</p>`;myE.forEach(e=>{const sc=e.status==='Replied'?'#22C55E':e.status==='No response'?'#EF4444':'#3B82F6';h+=`<div style="background:#161B27;border-radius:8px;padding:12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><span style="font-weight:700;color:#E2E8F0;font-size:14px">${esc(e.subject)}</span>${tag(e.status,sc)}</div><div style="font-size:11px;color:#64748B;margin-top:3px">${fmtDate(e.date)}</div>${e.body?`<p style="margin:6px 0 0;font-size:13px;color:#94A3B8">${esc(e.body)}</p>`:''}${e.followUpDate?`<p style="margin:4px 0 0;font-size:11px;color:#C8A84B">Follow-up: ${fmtDate(e.followUpDate)}</p>`:''}</div>`;});}else if(detailTab==='files'){if(!myF.length)h+=`<p style="color:#64748B;font-size:13px">No files.</p>`;myF.forEach(f=>h+=`<div style="background:#161B27;border-radius:8px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center"><span style="font-size:22px">📄</span><div style="flex:1">${f.url?`<a href="${esc(f.url)}" target="_blank" style="font-weight:700;font-size:14px;color:#3B82F6">${esc(f.name)}</a>`:`<span style="font-weight:700;font-size:14px;color:#E2E8F0">${esc(f.name)}</span>`}<div style="font-size:11px;color:#64748B;margin-top:2px">${fmtDate(f.date)} · ${tag(f.tag,'#64748B')}</div>${f.notes?`<p style="margin:4px 0 0;font-size:12px;color:#94A3B8">${esc(f.notes)}</p>`:''}</div></div>`);}return h+`</div>`;}
function switchTab(cid,tab){detailTab=tab;const c=state.contacts.find(x=>x.id===cid);if(c)document.getElementById('modal-body').innerHTML=renderDetail(c);}

// ── Modal ─────────────────────────────────────────────────────────────────
function showModal(id,title,body){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal-overlay').style.display='flex';}
function closeModal(){document.getElementById('modal-overlay').style.display='none';}

// ── Contact CRUD ──────────────────────────────────────────────────────────
function openContactModal(id){const v=id?state.contacts.find(x=>x.id===id):{};showModal('contact',id?'Edit contact':'New contact',`<form onsubmit="saveContact(event,'${id||''}')"><div class="grid2"><div class="field"><label>Full name <span class="req">*</span></label><input name="name" value="${esc(v.name||'')}" required></div><div class="field"><label>Company</label><input name="company" value="${esc(v.company||'')}"></div></div><div class="grid2"><div class="field"><label>Role</label><input name="role" value="${esc(v.role||'')}"></div><div class="field"><label>Owner</label><input name="owner" value="${esc(v.owner||'')}"></div></div><div class="grid2"><div class="field"><label>Email</label><input type="email" name="email" value="${esc(v.email||'')}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(v.phone||'')}"></div></div><div class="grid2"><div class="field"><label>LinkedIn</label><input name="linkedIn" value="${esc(v.linkedIn||'')}"></div><div class="field"><label>Website</label><input name="website" value="${esc(v.website||'')}"></div></div><div class="field"><label>Stage</label><select name="stage">${STAGES.map(s=>`<option ${(v.stage||'Lead')===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Tags</label><input name="tags" value="${esc(v.tags||'')}"></div><div class="field"><label>Notes</label><textarea name="notes" rows="3">${esc(v.notes||'')}</textarea></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Save</button></div></form>`);}
function saveContact(e,id){e.preventDefault();const f=new FormData(e.target);const obj={name:f.get('name'),company:f.get('company'),role:f.get('role'),owner:f.get('owner'),email:f.get('email'),phone:f.get('phone'),linkedIn:f.get('linkedIn'),website:f.get('website'),stage:f.get('stage'),tags:f.get('tags'),notes:f.get('notes')};if(id){state.contacts=state.contacts.map(c=>c.id===id?{...c,...obj}:c);}else{state.contacts.unshift({...obj,id:uid(),createdAt:today()});}saveLocal();closeModal();renderContent();}
function editContact(id){closeModal();setTimeout(()=>openContactModal(id),50);}
function deleteContact(id){if(!confirm('Delete this contact?'))return;state.contacts=state.contacts.filter(c=>c.id!==id);saveLocal();closeModal();renderContent();}

// ── Meeting / Email / File CRUD ───────────────────────────────────────────
function openMeetingModal(cid){showModal('meeting','Log meeting',`<form onsubmit="saveMeeting(event)"><div class="grid2"><div class="field"><label>Date <span class="req">*</span></label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Type</label><select name="type">${['Call','Video Meeting','In-Person','Conference','Email thread','Other'].map(t=>`<option>${t}</option>`).join('')}</select></div></div><div class="field"><label>Title <span class="req">*</span></label><input name="title" required></div><div class="field"><label>Contact</label><select name="contactId"><option value="">— select —</option>${state.contacts.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)} · ${esc(c.company)}</option>`).join('')}</select></div><div class="field"><label>Outcome</label><textarea name="outcome" rows="3"></textarea></div><div class="field"><label>Next step</label><input name="nextStep"></div><div class="field"><label>Files shared</label><input name="attachments"></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Save</button></div></form>`);}
function saveMeeting(e){e.preventDefault();const f=new FormData(e.target);state.meetings.unshift({id:uid(),date:f.get('date'),title:f.get('title'),contactId:f.get('contactId'),type:f.get('type'),outcome:f.get('outcome'),nextStep:f.get('nextStep'),attachments:f.get('attachments')});saveLocal();closeModal();renderContent();}
function openEmailModal(cid){showModal('email','Log email',`<form onsubmit="saveEmail(event)"><div class="grid2"><div class="field"><label>Date <span class="req">*</span></label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Status</label><select name="status">${['Sent','Opened','Replied','No response','Bounced'].map(s=>`<option>${s}</option>`).join('')}</select></div></div><div class="field"><label>Subject <span class="req">*</span></label><input name="subject" required></div><div class="field"><label>Contact</label><select name="contactId"><option value="">— select —</option>${state.contacts.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)} · ${esc(c.company)}</option>`).join('')}</select></div><div class="field"><label>Body</label><textarea name="body" rows="4"></textarea></div><div class="field"><label>Follow-up date</label><input type="date" name="followUpDate"></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Save</button></div></form>`);}
function saveEmail(e){e.preventDefault();const f=new FormData(e.target);state.emails.unshift({id:uid(),date:f.get('date'),subject:f.get('subject'),contactId:f.get('contactId'),status:f.get('status'),body:f.get('body'),followUpDate:f.get('followUpDate')});saveLocal();closeModal();renderContent();}
function openFileModal(cid){showModal('file','Log file',`<form onsubmit="saveFile(event)"><div class="grid2"><div class="field"><label>Date <span class="req">*</span></label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Type</label><select name="tag">${FILE_TAGS.map(t=>`<option>${t}</option>`).join('')}</select></div></div><div class="field"><label>File name <span class="req">*</span></label><input name="name" required></div><div class="field"><label>Sent to</label><select name="contactId"><option value="">— select —</option>${state.contacts.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)} · ${esc(c.company)}</option>`).join('')}</select></div><div class="field"><label>URL</label><input name="url"></div><div class="field"><label>Notes</label><textarea name="notes" rows="2"></textarea></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Save</button></div></form>`);}
function saveFile(e){e.preventDefault();const f=new FormData(e.target);state.files.unshift({id:uid(),date:f.get('date'),name:f.get('name'),contactId:f.get('contactId'),tag:f.get('tag'),url:f.get('url'),notes:f.get('notes')});saveLocal();closeModal();renderContent();}

// ── Boot ──────────────────────────────────────────────────────────────────
loadState();
initGoogleAuth();
renderTopbar();
renderContent();
</script>
</body>
</html>
